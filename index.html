<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>100-Day Fit</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1311"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1311;--card:#1a211e;--c2:#222b27;--tx:#f2f5f3;--mu:#8b9a92;--ac:#2ecc71;--wr:#f5a524;--rd:#ef5350;--bd:#2a342f}
[data-t=light]{--bg:#f1f5f2;--card:#fff;--c2:#eaf0ec;--tx:#14201a;--mu:#5d6b63;--bd:#d9e2dc}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 80% -10%,#1d3a2a55,transparent),var(--bg);color:var(--tx);min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font:600 11px system-ui;cursor:pointer}nav button span{display:block;font-size:20px}nav button.on{color:var(--ac)}
@media(min-width:900px){nav{top:0;right:auto;bottom:0;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:18px 10px}nav button{flex:0;text-align:left;padding:12px;font-size:14px;border-radius:12px;display:flex;gap:10px;align-items:center}nav button span{display:inline;font-size:18px}nav button.on{background:var(--c2)}#app{margin-left:210px;max-width:none;padding-right:30px}}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}.ac{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.st b{display:block;font-size:22px}.st{background:var(--c2);border-radius:14px;padding:10px}
.bar{height:9px;background:var(--c2);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f9d55,var(--ac));border-radius:9px;transition:width .5s}
button.b,.b{background:var(--ac);color:#06210f;border:0;border-radius:12px;padding:9px 14px;font:700 14px system-ui;cursor:pointer}.b.s{background:var(--c2);color:var(--tx)}.b.d{background:var(--rd);color:#fff}.b.m{padding:6px 10px;font-size:13px}
input,select,textarea{background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit;width:100%}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.sp{justify-content:space-between}.it{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}.it>div{flex:1;min-width:0}
.ch{width:100%;height:auto}.sv{fill:var(--mu);font-size:9px}.ring{width:96px;height:96px;flex:none}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}.cell{border:1.5px solid var(--bd);border-radius:11px;padding:5px;font-size:11px;cursor:pointer;background:var(--card);text-align:left;color:var(--tx)}.cell b{font-size:14px;display:block}
.done{background:#1f6b3d!important;border-color:var(--ac)}.part{background:#6b5a1f!important;border-color:var(--wr)}.rest{background:#1f3b52!important;border-color:#4aa3df}.miss{background:#5a2626!important;border-color:var(--rd)}.fut{opacity:.45}.tdy{outline:2px solid var(--ac)}
[data-t=light] .done{background:#bff0d2!important}[data-t=light] .part{background:#fbe7b5!important}[data-t=light] .rest{background:#cfe6f6!important}[data-t=light] .miss{background:#f8cccc!important}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}#md.on{display:flex}#md>div{background:var(--bg);border:1px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
@media(min-width:900px){#md{align-items:center}#md>div{border-radius:20px}}
#rt{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ac);color:#06210f;font-weight:800;border-radius:30px;padding:10px 16px;display:none;gap:8px;z-index:30}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:10px 16px;border-radius:14px;z-index:60;display:none;max-width:90%}
summary{cursor:pointer;color:var(--mu);font-size:13px}.warn{border-color:var(--wr)}.photo{width:44px;height:44px;border-radius:8px;object-fit:cover}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><nav id="nv"></nav><div id="rt"><span id="rtv"></span>s rest <a onclick="rtStop()" style="cursor:pointer">✕</a></div><div id="ts"></div><div id="md" onclick="if(event.target==this)mc()"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),K='fit100v1';
const DEF={start:null,tg:{kcal:2250,prot:125,water:2750,steps:6000,sleep:7,budget:100},p:{sw:94,tw:85,sx:38},theme:'dark',wt:{},notes:'',key:'',model:'gemini-2.5-flash',sens:2,ms:{},rem:{on:false,t:{'Morning weigh-in':'07:00','Morning workout':'07:30','Lunch':'13:00','Drink water':'16:00','Dinner':'20:00','Sleep time':'22:30'}},days:{}};
const mg=(a,b)=>{const o=structuredClone(a);for(const k in b)o[k]=(b[k]&&typeof b[k]=='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]=='object')?mg(a[k],b[k]):b[k];return o};
let S;try{S=mg(DEF,JSON.parse(localStorage.getItem(K))||{})}catch(e){S=structuredClone(DEF)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full — export a backup and remove old photos')}};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5),dow=s=>new Date(s+'T12:00:00').getDay();
const fd=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=d=>S.days[d]||{},D=d=>S.days[d]||(S.days[d]={h:Array(8).fill(false),ex:{},eat:{},extras:[],water:0});
const r1=n=>Math.round(n*10)/10,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
let tab=0,vd=today(),toastT;
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3500)}
const mo=h=>{$('#mb').innerHTML=h;$('#md').classList.add('on')},mc=()=>{$('#md').classList.remove('on');render()};
// ---------- data ----------
const F={egg:['Boiled egg','pc',78,6.3,7],idli:['Idli','pc',58,2,4],dosa:['Dosa','pc',130,3,6],samb:['Sambar','bowl (150 g)',90,4,6],ban:['Banana','pc',105,1.3,6],rice:['Cooked rice','100 g cooked',130,2.7,2.5],roti:['Roti','pc',100,3,3],dal:['Dal (DRY weight)','10 g dry',35,2.4,1.2],soy:['Soy chunks (DRY weight)','10 g dry',34,5.2,1.1],chp:['Chickpeas (DRY weight)','10 g dry',36,2,1.2],veg:['Vegetables','100 g',40,2,6],curd:['Curd','100 g',60,3.5,6],chk:['Chicken (raw weight)','100 g raw',120,22,25],fish:['Fish (raw weight)','100 g raw',110,20,20],oil:['Cooking oil','tsp (5 g)',45,0,1]};
const LX={1:['chk',1],2:['chp',8],3:['fish',1],4:['chk',1],5:['dal',3],6:['fish',1],0:['chk',1]};
function plan(d){const w=dow(d),b=w%2?[['egg',3],['dosa',2],['samb',1],['ban',1]]:[['egg',4],['idli',3],['samb',1],['ban',1]];
 const l=[['rice',3],['dal',7],['veg',1.5],['curd',1],['oil',1]];if(LX[w][0]!='dal'||1)l.push(LX[w]);
 return{b,l,d:[['rice',2.5],['soy',9],['veg',1.5],['curd',1],['oil',1]]}}
const M=d=>G(d).m||plan(d),MN={b:'Breakfast',l:'Lunch',d:'Dinner'};
const tot=a=>a.reduce((t,[f,q])=>(t.k+=q*F[f][2],t.p+=q*F[f][3],t.c+=q*F[f][4],t),{k:0,p:0,c:0});
const qty=(f,q)=>{const m=F[f][1].match(/^(\d+) (.*)$/);return m?`${r1(q*m[1])} ${m[2]}`:`${r1(q)} ${F[f][1]}`};
const WK={1:['Chest & Triceps',[['Dumbbell floor press',3,'10–12','Lie on floor, press dumbbells up, elbows ~45° from body.'],['Dumbbell floor fly',2,'10–12','Slight elbow bend, open arms wide until upper arms touch the floor, squeeze up.'],['Close-grip floor press',3,'10','Dumbbells touching, elbows tucked, press straight up.'],['Overhead triceps extension',3,'12','Hold one dumbbell with both hands behind head, extend up, keep elbows in.'],['Incline push-ups',2,'8–12','Hands on a sturdy chair/bed; body in a straight line.']]],
2:['Legs & Core',[['Goblet squats',3,'12','Hold dumbbell at chest, sit hips back, chest up, knees track toes.'],['Dumbbell Romanian deadlift',3,'12','Soft knees, push hips back, flat back, feel hamstrings stretch.'],['Reverse lunges',3,'10 each leg','Step back, lower back knee toward floor, drive through front heel.'],['Calf raises',3,'15','Rise onto toes, pause at top, lower slowly.'],['Plank',3,'30 sec','Elbows under shoulders, tight core, no sagging hips.'],['Dead bugs',3,'10','Back flat on floor; extend opposite arm and leg slowly.']]],
3:['Active Recovery',[['Brisk walk',1,'35–40 min','Pace where you can talk but not sing.'],['Light stretching',1,'10 min','Hold each stretch 20–30 sec, no pain.'],['Mobility work',1,'5–10 min','Hip circles, cat-cow, shoulder rolls.']]],
4:['Back & Biceps',[['Single-arm dumbbell row',3,'12','Hand on bench/chair, pull elbow to hip, squeeze shoulder blade.'],['Bent-over dumbbell row',3,'10','Hinge at hips, flat back, pull dumbbells to lower ribs.'],['Reverse fly',2,'12','Hinge forward, raise arms to sides with soft elbows.'],['Bicep curls',3,'12','Elbows pinned to sides, no swinging.'],['Hammer curls',2,'12','Palms facing each other, controlled tempo.']]],
5:['Chest & Shoulders',[['Dumbbell floor press',3,'12','Lie on floor, press up, controlled lowering.'],['Push-ups',2,'8–12','Straight body line; do on knees if needed.'],['Shoulder press',3,'10','Press overhead without arching your lower back.'],['Lateral raises',3,'12','Light weight, lift to shoulder height, lead with elbows.'],['Reverse fly',2,'12','Hinge forward, raise arms to sides with soft elbows.']]],
6:['Full Body',[['Goblet squats',3,'12','Hold dumbbell at chest, sit hips back, chest up.'],['Dumbbell rows',3,'12','Pull to hip, squeeze back.'],['Dumbbell Romanian deadlift',3,'12','Hinge at hips, flat back.'],['Bicep curls',2,'12','Elbows pinned, controlled.'],['Walking',1,'20 min','Easy to moderate pace.']]],
0:['Rest day',[['Light walk (optional)',1,'20 min','Easy pace.'],['Stretching',1,'10 min','Gentle, pain-free.']]]};
const HAB=['Completed workout or scheduled recovery','Followed meal plan','Met protein target','Drank enough water','Walked / hit step goal','Slept 7–9 hours','Avoided sugary drinks','Avoided junk food'];
const isRest=d=>[0,3].includes(dow(d));
const hp=d=>(G(d).h||[]).filter(Boolean).length/8;
const sleepH=d=>{const x=G(d);if(!x.bed||!x.wake)return null;const t=s=>{const[a,b]=s.split(':');return a*60+ +b};return((t(x.wake)-t(x.bed)+1440)%1440)/60};
const dayNo=()=>S.start?Math.max(1,Math.min(100,diff(S.start,today())+1)):0;
const wts=()=>Object.keys(S.days).sort().filter(d=>S.days[d].w).map(d=>({d,v:S.days[d].w}));
const lastOf=k=>{const a=Object.keys(S.days).sort().filter(d=>S.days[d][k]);return a.length?S.days[a.at(-1)][k]:null};
const wkAvg=()=>{const m={};wts().forEach(({d,v})=>{const w=S.start?Math.floor(diff(S.start,d)/7):0;(m[w]||(m[w]=[])).push(v)});return Object.keys(m).sort((a,b)=>a-b).map(w=>({l:'Wk '+(+w+1),v:r1(avg(m[w]))}))};
const eaten=d=>{const x=G(d),m=M(d);let k=0,p=0;for(const s of 'bld')if(x.eat&&x.eat[s]){const t=tot(m[s]);k+=t.k;p+=t.p}(x.extras||[]).forEach(e=>{k+=e.k;p+=e.p});return{k,p}};
function status(d){if(d>today())return'fut';const x=G(d),p=hp(d),any=x.w||x.wdone||p||x.water||(x.extras||[]).length||Object.values(x.eat||{}).some(Boolean);
 if(isRest(d)&&!any)return d==today()?'':'rest';if(!any)return d==today()?'':'miss';if(isRest(d)&&p<.75)return'rest';return p>=.75&&(x.wdone||isRest(d))?'done':'part'}
// ---------- charts ----------
function lc(a,c,u){if(a.length<2)return'<p class="mu">Log at least 2 entries to see the trend.</p>';a=a.slice(-60);const W=320,H=130,p=24,v=a.map(x=>x.v);let mn=Math.min(...v)-.5,mx=Math.max(...v)+.5;const X=i=>p+i*(W-2*p)/(a.length-1),Y=y=>H-p-(y-mn)/(mx-mn)*(H-2*p);
 return`<svg viewBox="0 0 ${W} ${H}" class="ch"><polyline points="${a.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>${a.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3" fill="${c}"><title>${x.l}: ${x.v}${u}</title></circle>`).join('')}<text x="2" y="11" class="sv">${mx.toFixed(1)}</text><text x="2" y="${H-4}" class="sv">${mn.toFixed(1)}</text><text x="${W-2}" y="${H-4}" text-anchor="end" class="sv">${a.at(-1).l}</text></svg>`}
function bc(a,c,goal,u){if(!a.length)return'<p class="mu">No data yet.</p>';const W=320,H=120,p=20,mx=Math.max(goal||0,...a.map(x=>x.v),1),bw=(W-2*p)/a.length;
 return`<svg viewBox="0 0 ${W} ${H}" class="ch">${a.map((x,i)=>{const h=x.v/mx*(H-2*p);return`<rect x="${p+i*bw+1}" y="${H-p-h}" width="${Math.max(bw-3,2)}" height="${h}" rx="3" fill="${c}"><title>${x.l}: ${r1(x.v)}${u}</title></rect>`}).join('')}${goal?`<line x1="${p}" x2="${W-p}" y1="${H-p-goal/mx*(H-2*p)}" y2="${H-p-goal/mx*(H-2*p)}" stroke="#f5a524" stroke-dasharray="4"/>`:''}<text x="2" y="11" class="sv">${r1(mx)}${u}</text></svg>`}
const last=(n,f)=>{const o=[];for(let i=n-1;i>=0;i--){const d=addD(today(),-i);o.push({l:fd(d),v:f(d)})}return o};
const bar=(v,m)=>`<div class="bar"><i style="width:${Math.min(100,m?v/m*100:0)}%"></i></div>`;
// ---------- pages ----------
function pDash(){const t=today(),n=dayNo(),X=G(t),w=wts(),lw=w.length?w.at(-1).v:S.p.sw,lost=r1(S.p.sw-lw),rem=r1(Math.max(0,lw-S.p.tw)),e=eaten(t),wk=wkAvg(),pc=S.start?Math.round(n/100*100):0,hc=Math.round(hp(t)*100),sl=sleepH(t),wo=WK[dow(t)];
 const ring=`<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--c2)" stroke-width="3"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--ac)" stroke-width="3" stroke-dasharray="${pc} 100" stroke-linecap="round" transform="rotate(-90 18 18)" style="transition:stroke-dasharray .8s"/><text x="18" y="21" text-anchor="middle" fill="var(--tx)" font-size="8" font-weight="800">${pc}%</text></svg>`;
 let h=S.start?`<div class="card row">${ring}<div><div class="mu">Your challenge</div><h1 style="margin:0">Day ${n} / 100</h1><div class="mu">${fd(S.start)} → ${fd(addD(S.start,99))} (Day 100)</div><div class="mu">Missed a day? Nothing resets — just continue.</div></div></div>`:`<div class="card"><h1>Ready to start?</h1><p class="mu">Starting sets Day 1 to today and Day 100 to ${fd(addD(t,99))}.</p><button class="b" onclick="S.start=today();save();render()">Activate 100-day challenge</button></div>`;
 h+=`<div class="g" style="margin-bottom:12px"><div class="st"><span class="mu">Start</span><b>${S.p.sw} kg</b></div><div class="st"><span class="mu">Latest</span><b>${lw} kg</b></div><div class="st"><span class="mu">Target</span><b>${S.p.tw} kg</b></div><div class="st"><span class="mu">To lose</span><b>${rem} kg</b></div><div class="st"><span class="mu">Lost</span><b class="ac">${lost} kg</b></div><div class="st"><span class="mu">Waist</span><b>${lastOf('waist')||S.p.sx} in</b></div></div>`;
 h+=`<div class="g2"><div class="card"><div class="row sp"><h2>Today · ${fd(t)}</h2><button class="b m" onclick="openLog('${t}')">Log weight &amp; more</button></div><div class="mu">Calories eaten (estimate): ${Math.round(e.k)} / ${S.tg.kcal}</div>${bar(e.k,S.tg.kcal)}<div class="mu">Protein (estimate): ${Math.round(e.p)} / ${S.tg.prot} g</div>${bar(e.p,S.tg.prot)}<div class="row sp"><span class="mu">💧 ${X.water||0} / ${S.tg.water} ml</span><span class="row"><button class="b s m" onclick="addW(250)">+250</button><button class="b s m" onclick="addW(500)">+500</button><button class="b s m" onclick="addW()">+…</button></span></div>${bar(X.water||0,S.tg.water)}<div class="mu">😴 Sleep: ${sl?r1(sl)+' h':'not logged'} (goal ${S.tg.sleep}–9 h)</div></div>
 <div class="card"><div class="row sp"><h2>👣 Steps: <span id="stp">${X.steps||0}</span> / ${S.tg.steps}</h2><button class="b m ${stepOn?'d':''}" onclick="stepToggle()">${stepOn?'Stop counter':'Start counter'}</button></div>${bar(X.steps||0,S.tg.steps)}<div class="mu">Phone sensor counts while this screen stays open. Calories burned ≈ ${Math.round((X.steps||0)*.04)} kcal (rough estimate).</div></div>
 <div class="card"><h2>Today's workout: ${wo[0]}</h2>${wo[1].map(x=>`<div class="mu">${(X.ex||{})[x[0]]?'✅':'▫️'} ${x[0]} · ${x[1]>1?x[1]+'×':''}${x[2]}</div>`).join('')}<button class="b m" style="margin-top:8px" onclick="vd=today();go(1)">Open workout</button></div>
 <div class="card"><h2>Today's meals</h2>${'bld'.split('').map(s=>`<label class="row" style="margin:4px 0;color:var(--tx);font-size:14px"><input type="checkbox" ${(X.eat||{})[s]?'checked':''} onchange="D('${t}').eat['${s}']=this.checked;save();render()">${MN[s]} · ${Math.round(tot(M(t)[s]).k)} kcal · ${Math.round(tot(M(t)[s]).p)} g protein</label>`).join('')}<button class="b m s" onclick="vd=today();go(2)">Edit meals</button></div></div>
 <div class="card"><div class="row sp"><h2>Daily habits</h2><b class="ac">${hc}%</b></div>${HAB.map((x,i)=>`<label class="row" style="margin:5px 0;color:var(--tx);font-size:14px"><input type="checkbox" ${(X.h||[])[i]?'checked':''} onchange="D('${t}').h[${i}]=this.checked;save();render()">${x}</label>`).join('')}</div>
 <div class="g2"><div class="card"><h2>Weekly average weight</h2>${lc(wk,'#2ecc71',' kg')}<p class="mu">Single-day weight swings with water and food. Judge progress by weekly averages.</p></div><div class="card"><h2>100-day timeline</h2><div style="display:flex;flex-wrap:wrap;gap:3px">${Array.from({length:100},(_,i)=>{const d=S.start?addD(S.start,i):null,s=d?status(d):'fut',c={done:'#2ecc71',part:'#f5a524',rest:'#4aa3df',miss:'#ef5350',fut:'var(--c2)','':'var(--c2)'}[s];return`<span title="Day ${i+1}" style="width:13px;height:13px;border-radius:4px;background:${c}${d==t?';outline:2px solid var(--tx)':''}"></span>`}).join('')}</div></div></div>`;return h}
function dayNav(){return`<div class="row sp card"><button class="b s m" onclick="vd=addD(vd,-1);render()">‹</button><b>${new Date(vd+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}${S.start&&diff(S.start,vd)>=0&&diff(S.start,vd)<100?' · Day '+(diff(S.start,vd)+1):''}</b><span class="row"><button class="b s m" onclick="vd=today();render()">Today</button><button class="b s m" onclick="vd=addD(vd,1);render()">›</button></span></div>`}
function pWork(){const x=G(vd),w=WK[dow(vd)],done=w[1].filter(e=>(x.ex||{})[e[0]]).length,hist=Object.keys(S.days).sort().reverse().filter(d=>S.days[d].wdone).slice(0,12);
